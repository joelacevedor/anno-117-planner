name: Publicar en Firebase Hosting
# Publica la app en Firebase Hosting.
# Requiere, en Settings → Secrets and variables → Actions:
#  - secreto  FIREBASE_SERVICE_ACCOUNT: JSON de una cuenta de servicio del proyecto
#  - variable FIREBASE_CONFIG: configuración web del proyecto (JSON, una línea)
# Opcional, para los avisos del chat (Cloudflare Worker, gratis y sin tarjeta):
#  - secreto  CLOUDFLARE_API_TOKEN: token con la plantilla «Edit Cloudflare Workers»
#  - secreto  CLOUDFLARE_ACCOUNT_ID: identificador de la cuenta de Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Comprobar secreto y configuración
        id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CFG: ${{ vars.FIREBASE_CONFIG }}
        run: |
          if [ -z "$SA" ] || [ -z "$CFG" ]; then
            echo "Falta FIREBASE_SERVICE_ACCOUNT o FIREBASE_CONFIG: no se publica."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "project=$(printf '%s' "$CFG" | jq -r .projectId)" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.ok == 'true'
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.check.outputs.ok == 'true'
      - run: pnpm test
        if: steps.check.outputs.ok == 'true'
      - name: Cartero de avisos (Cloudflare Worker)
        id: push
        if: steps.check.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: push-worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::notice::Sin CLOUDFLARE_API_TOKEN: la app se publica sin avisos del chat."; exit 0; fi
          npm ci --no-audit --no-fund
          W="npx --yes wrangler@4.151.0"
          set +e
          $W deploy > deploy.log 2>&1; code=$?
          set -e
          cat deploy.log
          if [ $code -ne 0 ]; then
            grep -iE "error|subdomain|auth|permission" deploy.log | head -n 6 | while read -r line; do echo "::error::$line"; done
            echo "::warning::No se pudo publicar el cartero de avisos; la app se publica sin ellos."; exit 0
          fi
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
          # Clave VAPID: se genera una sola vez y se guarda como secreto del Worker (nunca sale de Cloudflare).
          if ! $W secret list 2>/dev/null | grep -q VAPID_PRIVATE_JWK; then
            node -e 'crypto.subtle.generateKey({name:"ECDSA",namedCurve:"P-256"},true,["sign"]).then(k=>crypto.subtle.exportKey("jwk",k.privateKey)).then(j=>process.stdout.write(JSON.stringify(j)))' | $W secret put VAPID_PRIVATE_JWK
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice::Cartero de avisos en $URL"
      - run: pnpm build
        if: steps.check.outputs.ok == 'true'
        env:
          VITE_FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
          VITE_PUSH_URL: ${{ steps.push.outputs.url }}
      - name: Publicar en Firebase Hosting
        if: steps.check.outputs.ok == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          npx --yes firebase-tools@15.34.0 deploy --only hosting --project "${{ steps.check.outputs.project }}" --non-interactive > deploy.log 2>&1
          code=$?
          set -e
          rm -f "$RUNNER_TEMP/sa.json"
          tail -n 40 deploy.log
          if [ $code -ne 0 ]; then
            grep -iE "error|denied|permission|not found|404|403" deploy.log | head -n 8 | while read -r line; do echo "::error::$line"; done
            exit $code
          fi
