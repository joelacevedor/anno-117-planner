name: Servidor MCP (ChatGPT) · pruebas y despliegue de prueba
# Servidor MCP de solo lectura para consultar partidas de Praefectus desde ChatGPT (mcp-worker/).
# Independiente de la app: no compila ni publica la app, no toca Firebase Hosting ni el cartero de avisos.
#  - Solo se ejecuta en la rama mcp-chatgpt.
#  - Despliega UN Worker propio, «praefectus-mcp-test», con su propio almacén KV. Nunca toca «anno117-push».
#  - Usa los mismos secretos de Cloudflare que el cartero (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID) y la
#    variable FIREBASE_CONFIG (solo apiKey y projectId, que ya son públicos en la web de la app).
#  - No necesita FIREBASE_SERVICE_ACCOUNT: el Worker lee como un jugador, sin credenciales de administrador.
on:
  push:
    branches: [mcp-chatgpt]
    paths: ["mcp-worker/**", "src/**", ".github/workflows/mcp-worker.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mcp-worker
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Dependencias de la app: el Worker importa src/core y src/data tal cual.
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: npm ci --no-audit --no-fund
        working-directory: mcp-worker
      - run: npx tsc --noEmit -p .
        working-directory: mcp-worker
      # Vitest de la app (misma versión), con la configuración de mcp-worker/vitest.config.ts.
      - run: ../node_modules/.bin/vitest run
        working-directory: mcp-worker
      - run: npm audit --audit-level high --omit dev
        working-directory: mcp-worker

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Comprobar secretos
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CFG: ${{ vars.FIREBASE_CONFIG }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CFG" ]; then
            echo "::error::Faltan CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID o FIREBASE_CONFIG: no se despliega."; exit 1
          fi
          echo "apikey=$(printf '%s' "$CFG" | jq -r .apiKey)" >> "$GITHUB_OUTPUT"
          echo "project=$(printf '%s' "$CFG" | jq -r .projectId)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm ci --no-audit --no-fund
        working-directory: mcp-worker
      - name: Desplegar praefectus-mcp-test
        working-directory: mcp-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APIKEY: ${{ steps.check.outputs.apikey }}
          PROJECT: ${{ steps.check.outputs.project }}
        run: |
          W="npx wrangler"
          NAME=$(grep -m1 '^name' wrangler.toml | cut -d'"' -f2)
          if [ "$NAME" = "anno117-push" ]; then echo "::error::Nombre de Worker reservado"; exit 1; fi

          # Almacén KV propio (permisos y tokens OAuth). Se crea una vez y se reutiliza.
          KV_TITLE="$NAME-oauth"
          KV_ID=$($W kv namespace list 2>/dev/null | jq -r --arg t "$KV_TITLE" '.[] | select(.title == $t) | .id' | head -n 1)
          if [ -z "$KV_ID" ]; then
            $W kv namespace create "$KV_TITLE" > kv.log 2>&1 || { cat kv.log; exit 1; }
            KV_ID=$($W kv namespace list | jq -r --arg t "$KV_TITLE" '.[] | select(.title == $t) | .id' | head -n 1)
          fi
          [ -n "$KV_ID" ] || { echo "::error::No se pudo crear el almacén KV"; exit 1; }
          sed -i "s/REPLACED_BY_WORKFLOW/$KV_ID/" wrangler.toml

          VARS="--var FIREBASE_API_KEY:$APIKEY --var FIREBASE_PROJECT_ID:$PROJECT"
          # 1.ª publicación: averiguar la dirección pública (*.workers.dev).
          $W deploy $VARS --var PUBLIC_ORIGIN:https://pending.invalid > deploy.log 2>&1 || { cat deploy.log; exit 1; }
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
          [ -n "$URL" ] || { cat deploy.log; echo "::error::No se encontró la dirección del Worker"; exit 1; }

          # Secreto para los identificadores internos de partida: se genera una vez y nunca sale de Cloudflare.
          if ! $W secret list 2>/dev/null | grep -q GRANT_SECRET; then
            node -e 'process.stdout.write(require("crypto").randomBytes(48).toString("base64url"))' | $W secret put GRANT_SECRET
          fi

          # 2.ª publicación con la dirección definitiva.
          $W deploy $VARS --var PUBLIC_ORIGIN:$URL > deploy2.log 2>&1 || { cat deploy2.log; exit 1; }
          tail -n 15 deploy2.log

          # Comprobación: el servidor responde y pide OAuth.
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/mcp" -H 'Content-Type: application/json' -d '{}')
          meta=$(curl -s "$URL/.well-known/oauth-authorization-server" | jq -r '.issuer')
          echo "::notice title=Servidor MCP de prueba::$URL/mcp (sin token: HTTP $code; issuer: $meta; GAME_SCOPE: $(grep -m1 GAME_SCOPE wrangler.toml | cut -d'"' -f2))"
          {
            echo "### Servidor MCP de prueba"
            echo ""
            echo "- Dirección para ChatGPT: \`$URL/mcp\`"
            echo "- Sin token responde: HTTP $code (debe ser 401)"
            echo "- Partidas aceptadas: \`$(grep -m1 GAME_SCOPE wrangler.toml | cut -d'"' -f2)\`"
            echo "- Desconectar una partida: $URL/disconnect"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" = "401" ] || { echo "::error::El servidor no responde como se esperaba"; exit 1; }
